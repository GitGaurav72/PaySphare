spring:
  application:
    name: PaySphere
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    default-property-inclusion: non_null
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
        connectiontimeout: 5000
        timeout: 5000
        writetimeout: 5000
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
server:
  # Render assigns the public port through the PORT environment variable.
  # 8082 keeps the current local-development default.
  port: ${PORT:8082}
app:
  jwt:
    secret: ${JWT_SECRET:}
    expiration-ms: ${JWT_EXPIRATION:3600000}
  cors:
    allowed-origin: ${FRONTEND_URL:http://localhost:4200}
  seed:
    enabled: ${SEED_ENABLED:true}
    employee-count: ${SEED_EMPLOYEE_COUNT:10000}
  mail:
    from: ${MAIL_FROM:noreply@paysphere.com}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  health:
    # Render has no SMTP server at localhost:1025. Keep service health focused
    # on dependencies needed to serve requests (such as the database).
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
