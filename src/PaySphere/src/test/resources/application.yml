spring:
  datasource:
    url: jdbc:h2:mem:paysphere-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    show-sql: false
  flyway:
    enabled: false
  mail:
    host: localhost
    port: 1025
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
        connectiontimeout: 1000
        timeout: 1000
        writetimeout: 1000

app:
  jwt:
    secret: test-only-secret-key-for-jwt-signing-not-for-production-use-0123456789
    expiration-ms: 3600000
  cors:
    allowed-origin: http://localhost:4200
  seed:
    enabled: false
  mail:
    from: noreply@paysphere.com

logging:
  level:
    com.PaySphere: INFO
